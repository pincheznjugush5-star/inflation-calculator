name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      # Fails if the committed data has fallen behind the calendar: a new
      # annual figure should exist but has not been fetched yet. This is the
      # signal that the scheduled refresh did not run or did not succeed.
      - name: Check data is current
        run: python3 tools/refresh.py --check
