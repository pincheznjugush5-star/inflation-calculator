name: Refresh data

# Annual CPI figures are published after the year ends (the BLS releases the
# December figure in mid-January), and both the BLS and the World Bank revise
# history from time to time. A monthly run keeps the shipped data current
# without anyone having to remember.
on:
  schedule:
    - cron: "17 6 5 * *" # 06:17 UTC on the 5th of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetches both series, validates against the source anchors, prints what
      # moved, and runs the test suite. Fails loudly on drift or staleness.
      - name: Refresh and verify
        run: python3 tools/refresh.py | tee /tmp/refresh.log

      - name: Collect the change summary
        id: summary
        if: always()
        run: |
          {
            echo "SUMMARY<<REFRESH_EOF"
            if grep -q '^UNCHANGED$' /tmp/refresh.log 2>/dev/null; then
              echo "UNCHANGED"
            else
              sed -n '/=== Changes vs committed data ===/,/^CHANGED$/p' /tmp/refresh.log
            fi
            echo "REFRESH_EOF"
          } >> "$GITHUB_OUTPUT"

      # Opened as a pull request rather than pushed directly, so a revision or
      # a newly published year is reviewed before it changes what the app shows.
      - name: Open a pull request with the refreshed data
        if: steps.summary.outputs.SUMMARY != 'UNCHANGED'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.summary.outputs.SUMMARY }}
        run: |
          if git diff --quiet; then
            echo "No file changes; nothing to propose."
            exit 0
          fi
          branch="refresh-data/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/
          git commit -m "Refresh CPI data"
          git push --force-with-lease origin "$branch"
          body="$(printf 'Automated refresh of the shipped index data.\n\n```\n%s\n```\n\nGenerated by the scheduled Refresh data workflow.\n' "$SUMMARY")"
          gh pr create --title "Refresh CPI data" --body "$body" \
            --base "${GITHUB_REF_NAME:-main}" --head "$branch" \
          || gh pr edit "$branch" --body "$body"
